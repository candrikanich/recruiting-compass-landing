# Deploy to Production - Auto on push to main
name: Deploy to Production

on:
  push:
    branches: [main]

# Prevent overlapping production deploys; latest push wins.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npx nuxi prepare

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Build exactly once and upload that output. A plain `vercel deploy`
      # uploaded this runner's .output/ and rebuilt remotely, and the two
      # builds' hashes got mixed: pages linked entry CSS/JS the deployment
      # didn't contain, so the site rendered with no styles (Oct 2026).
      - name: Build and deploy to Vercel (prebuilt)
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          # Nitro only auto-detects Vercel when VERCEL is set, which a GitHub
          # runner doesn't do; without this it builds node-server into .output/
          # and `vercel build` fails looking for the project's "dist" directory.
          NITRO_PRESET: vercel

      - name: Verify deployed assets
        run: node scripts/check-deployed-assets.mjs https://www.therecruitingcompass.com

      - name: Slack Notification - Success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 Landing Production Deployed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🚀 Landing Production Deployed Successfully*\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                }
              }]
            }

      - name: Slack Notification - Failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Landing Production Deployment Failed - URGENT",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🚨 Landing Production Deployment Failed (URGENT)*\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }]
            }
